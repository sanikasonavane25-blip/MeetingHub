{% extends "base.html" %}
{% block title %}New meeting{% endblock %}
{% block content %}
<h1 class="h2">New meeting or work transfer</h1>
<form method="post" action="/meetings" class="panel grid max-w-2xl gap-4">
  <div><label class="lbl" for="title">Title</label>
    <input class="input" id="title" name="title" required maxlength="150" placeholder="Sprint 43 planning"></div>
  <div class="grid gap-4 sm:grid-cols-2">
    <div><label class="lbl" for="kind">Type</label>
      <select class="input" id="kind" name="kind"><option value="meeting">Meeting</option><option value="handover">Work transfer (handover)</option></select></div>
    <div><label class="lbl" for="scheduled_at">When</label>
      <input class="input" type="datetime-local" id="scheduled_at" name="scheduled_at"></div>
  </div>
  <div><label class="lbl" for="participants">Participants (comma-separated names)</label>
    <input class="input" id="participants" name="participants" placeholder="Asha, Rahul, Meera"></div>
  <div><label class="lbl" for="agenda">Agenda</label>
    <textarea class="input" id="agenda" name="agenda" rows="4"></textarea></div>
  <div><button class="btn">Create</button></div>
</form>
{% endblock %}
