services:
  - type: web
    name: meetinghub
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-flash-lite-latest
      - key: AI_API_KEY
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
